<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopVault — Dashboard Produk Lokal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-alt: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f97316;
      --teal: #14b8a6;
      --ok: #10b981;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 21px;
      margin: 0;
    }
    .sub {
      font-size: 12.5px;
      color: var(--muted);
      margin: 2px 0 0;
    }
    .pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .pill.ok {
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.14);
    }
    .pill.warn {
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.14);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .stat .lbl { font-size: 11.5px; color: var(--muted); }
    .stat .val { font-size: 20px; font-weight: 800; margin-top: 2px; }
    .banner {
      display: none;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 13px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 200px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 13.5px;
    }
    button, a.btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #334155;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    button.primary, a.btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.teal, a.btn.teal {
      background: #0f766e;
      border-color: var(--teal);
      color: #fff;
    }
    button.danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .p-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .thumb {
      width: 84px;
      height: 84px;
      border-radius: 8px;
      object-fit: cover;
      background: #090e1a;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .p-body {
      flex: 1;
      min-width: 0;
    }
    .shop-line {
      font-size: 11.5px;
      color: #5eead4;
      font-weight: 700;
    }
    .p-title {
      font-size: 15px;
      font-weight: 700;
      margin: 3px 0 6px;
      word-break: break-word;
    }
    .price-line {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
    }
    .meta-line {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f766e;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 99;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    @media (max-width: 520px) {
      .p-card { flex-direction: column; }
      .thumb { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>ShopVault Dashboard</h1>
        <p class="sub">Server Lokal <code>com.mykiwi.vault</code> • Data Produk &amp; Aset Konten</p>
      </div>
      <span id="kiwiPill" class="pill warn">Memeriksa koneksi...</span>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="lbl">Produk Tersimpan</div>
        <div id="stTotal" class="val">0</div>
      </div>
      <div class="stat">
        <div class="lbl">Antrean Aktif</div>
        <div id="stQueue" class="val">0</div>
      </div>
      <div class="stat">
        <div class="lbl">Butuh Perhatian</div>
        <div id="stAttn" class="val">0</div>
      </div>
    </div>

    <div id="attnBanner" class="banner">
      <span id="attnText">Ada antrean yang tertunda.</span>
      <button id="retryBtn" class="teal">Ulangi Antrean</button>
    </div>

    <!-- Tambah Link Cepat -->
    <div class="toolbar">
      <input id="enqueueInput" type="text" placeholder="Tempel link s.shopee.co.id / shopee.co.id untuk dimasukkan antrean..." />
      <button id="enqueueBtn" class="primary">+ Masukkan Antrean</button>
    </div>

    <!-- Pencarian & Ekspor -->
    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Cari judul produk, nama toko, atau ID..." />
      <button id="refreshBtn">🔄 Refresh</button>
      <a class="btn teal" href="/api/export.json" target="_blank">📦 Unduh Semua JSON</a>
      <a class="btn" href="/api/export.csv" target="_blank">📊 Unduh CSV</a>
    </div>

    <div id="productList" class="grid"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    (function () {
      "use strict";
      const kiwiPill = document.getElementById("kiwiPill");
      const stTotal = document.getElementById("stTotal");
      const stQueue = document.getElementById("stQueue");
      const stAttn = document.getElementById("stAttn");
      const attnBanner = document.getElementById("attnBanner");
      const attnText = document.getElementById("attnText");
      const retryBtn = document.getElementById("retryBtn");
      const enqueueInput = document.getElementById("enqueueInput");
      const enqueueBtn = document.getElementById("enqueueBtn");
      const searchInput = document.getElementById("searchInput");
      const refreshBtn = document.getElementById("refreshBtn");
      const productList = document.getElementById("productList");
      const toast = document.getElementById("toast");

      let searchTimer = null;

      function showToast(msg) {
        toast.textContent = msg;
        toast.style.display = "block";
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => {
          toast.style.display = "none";
        }, 2200);
      }

      function formatIdr(n) {
        if (n === null || n === undefined) return "-";
        return "Rp " + Number(n).toLocaleString("id-ID");
      }

      async function copyText(label, val) {
        try {
          await navigator.clipboard.writeText(val);
          showToast("✅ " + label + " disalin!");
        } catch (_) {
          const ta = document.createElement("textarea");
          ta.value = val;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          showToast("✅ " + label + " disalin!");
        }
      }

      async function loadHealth() {
        try {
          const r = await fetch("/api/health", { cache: "no-store" });
          const d = await r.json();
          if (!d || !d.ok) return;
          if (d.kiwiConnected) {
            kiwiPill.textContent = "Kiwi Worker: Terhubung";
            kiwiPill.className = "pill ok";
          } else {
            kiwiPill.textContent = "Kiwi Worker: Menunggu";
            kiwiPill.className = "pill warn";
          }
          stTotal.textContent = String(d.totalProducts || 0);
          stQueue.textContent = String((d.queuedCount || 0) + (d.processingCount || 0));
          stAttn.textContent = String(d.attentionCount || 0);

          if ((d.attentionCount || 0) > 0) {
            attnBanner.style.display = "flex";
            attnText.textContent =
              "⚠️ " +
              d.attentionCount +
              " link tertunda: " +
              (d.lastAttentionReason || "Periksa sesi Shopee di Kiwi Dev");
          } else {
            attnBanner.style.display = "none";
          }
        } catch (_) {
          kiwiPill.textContent = "Server Offline";
          kiwiPill.className = "pill warn";
        }
      }

      async function loadProducts() {
        const q = (searchInput.value || "").trim();
        const url = q ? "/api/products?q=" + encodeURIComponent(q) : "/api/products";
        try {
          const r = await fetch(url, { cache: "no-store" });
          const d = await r.json();
          renderProducts((d && d.products) || []);
        } catch (_) {
          productList.innerHTML = '<div class="empty">Gagal memuat daftar produk.</div>';
        }
      }

      function renderProducts(items) {
        productList.innerHTML = "";
        if (!items.length) {
          productList.innerHTML =
            '<div class="empty">Belum ada produk yang cocok.<br/>Buka aplikasi Shopee ➔ Klik <strong>Share</strong> pada produk ➔ Pilih <strong>Simpan Produk</strong>.</div>';
          return;
        }

        for (const p of items) {
          const card = document.createElement("div");
          card.className = "p-card";

          if (p.coverImageUrl) {
            const img = document.createElement("img");
            img.className = "thumb";
            img.loading = "lazy";
            img.referrerPolicy = "no-referrer";
            img.src = p.coverImageUrl;
            img.alt = p.title || "Produk";
            card.appendChild(img);
          }

          const body = document.createElement("div");
          body.className = "p-body";

          const shop = document.createElement("div");
          shop.className = "shop-line";
          const shopParts = [p.shopName || (p.sourcePlatform || "WEB").toUpperCase()];
          if (p.isOfficialShop) shopParts.push("✓ Official Mall");
          if (p.shopLocation) shopParts.push(p.shopLocation);
          shop.textContent = shopParts.join(" • ");
          body.appendChild(shop);

          const title = document.createElement("div");
          title.className = "p-title";
          title.textContent = p.title || p.cleanUrl;
          body.appendChild(title);

          const price = document.createElement("div");
          price.className = "price-line";
          let pText =
            p.priceMin !== null && p.priceMax !== null && p.priceMax > p.priceMin
              ? formatIdr(p.priceMin) + " - " + formatIdr(p.priceMax)
              : formatIdr(p.priceMin);
          if (p.discountPercent) pText += " (-" + p.discountPercent + "%)";
          price.textContent = pText;
          body.appendChild(price);

          const meta = document.createElement("div");
          meta.className = "meta-line";
          const mParts = [];
          if (p.ratingStar) mParts.push("⭐ " + p.ratingStar);
          if (p.soldCount !== null && p.soldCount !== undefined) {
            mParts.push("Terjual " + Number(p.soldCount).toLocaleString("id-ID"));
          }
          if (p.stock !== null && p.stock !== undefined) mParts.push("Stok " + p.stock);
          const imgs = Array.isArray(p.images) ? p.images : [];
          if (imgs.length) mParts.push("🖼️ " + imgs.length + " Foto");
          if (p.videoUrl) mParts.push("🎬 Ada Video MP4");
          meta.textContent = mParts.join(" • ");
          body.appendChild(meta);

          const actions = document.createElement("div");
          actions.className = "actions";

          const btnAff = document.createElement("button");
          btnAff.className = "primary";
          btnAff.textContent = "📋 Copy Link Affiliate";
          btnAff.onclick = () => copyText("Link Affiliate", p.affiliateUrl || p.cleanUrl);
          actions.appendChild(btnAff);

          if (p.videoUrl) {
            const aVid = document.createElement("a");
            aVid.className = "btn teal";
            aVid.href = p.videoUrl;
            aVid.target = "_blank";
            aVid.rel = "noopener noreferrer";
            aVid.textContent = "🎬 Buka Video MP4";
            actions.appendChild(aVid);
          }

          if (imgs.length > 0) {
            const btnImgs = document.createElement("button");
            btnImgs.textContent = "🖼️ Copy " + imgs.length + " URL Foto";
            btnImgs.onclick = () => copyText("URL Foto HD", imgs.join("\n"));
            actions.appendChild(btnImgs);
          }

          const aRaw = document.createElement("a");
          aRaw.className = "btn";
          aRaw.href = "/api/products/" + p.id + "/raw";
          aRaw.target = "_blank";
          aRaw.textContent = "📄 Raw JSON";
          actions.appendChild(aRaw);

          const aClean = document.createElement("a");
          aClean.className = "btn";
          aClean.href = p.cleanUrl;
          aClean.target = "_blank";
          aClean.rel = "noopener noreferrer";
          aClean.textContent = "🌐 Web Produk";
          actions.appendChild(aClean);

          const btnDel = document.createElement("button");
          btnDel.className = "danger";
          btnDel.textContent = "🗑️ Hapus";
          btnDel.onclick = async () => {
            if (!confirm('Hapus produk "' + (p.title || "") + '"?')) return;
            await fetch("/api/products/" + p.id, { method: "DELETE" });
            showToast("Produk dihapus");
            refreshAll();
          };
          actions.appendChild(btnDel);

          body.appendChild(actions);
          card.appendChild(body);
          productList.appendChild(card);
        }
      }

      enqueueBtn.addEventListener("click", async () => {
        const val = (enqueueInput.value || "").trim();
        if (!val) return;
        enqueueBtn.disabled = true;
        try {
          const r = await fetch("/api/enqueue", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: val }),
          });
          const d = await r.json();
          if (d && d.ok) {
            enqueueInput.value = "";
            showToast("📥 Link masuk antrean!");
            refreshAll();
          } else {
            showToast("❌ " + ((d && d.error) || "Gagal menambahkan link"));
          }
        } finally {
          enqueueBtn.disabled = false;
        }
      });

      retryBtn.addEventListener("click", async () => {
        await fetch("/api/queue/retry", { method: "POST" });
        showToast("🔄 Mengulangi antrean...");
        refreshAll();
      });

      refreshBtn.addEventListener("click", refreshAll);

      searchInput.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadProducts, 220);
      });

      function refreshAll() {
        loadHealth();
        loadProducts();
      }

      refreshAll();
      setInterval(loadHealth, 5000);
    })();
  </script>
</body>
</html>
