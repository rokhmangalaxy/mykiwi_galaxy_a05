name: Build ShopVault APK & Kiwi Extension

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run extension & XML verification tests
        run: node tests/test_pipeline.mjs

      - name: Package Kiwi Browser Extension (.zip)
        run: |
          mkdir -p dist
          cd kiwi-extension
          zip -r ../dist/shopvault-kiwi-extension.zip . -x "*.DS_Store"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-bridge/local.properties
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build ShopVault Debug APK (com.mykiwi.vault)
        working-directory: android-bridge
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; then
            ERR_SUMMARY=$(grep -E "e: |FAILURE:|What went wrong:|Execution failed|> " build.log | tail -n 25 | tr '\n' ' ')
            echo "::error title=Gradle Build Failed::$ERR_SUMMARY"
            exit 1
          fi

      - name: Collect build outputs
        run: |
          cp android-bridge/app/build/outputs/apk/debug/app-debug.apk dist/ShopVault-com.mykiwi.vault-debug.apk
          ls -lh dist/

      - name: Upload Ready-to-Install Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shopvault-galaxy-a05-bundle
          path: |
            dist/ShopVault-com.mykiwi.vault-debug.apk
            dist/shopvault-kiwi-extension.zip
          if-no-files-found: error
